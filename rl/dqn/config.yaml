defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 123
      consider_prior: true
      prior_weight: 1.0
      consider_magic_clip: true
      consider_endpoints: false
      n_startup_trials: 10
      n_ei_candidates: 24
      multivariate: true
      warn_independent_sampling: true
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction:
    - maximize
    - maximize
    study_name: sphere
    storage: null
    n_trials: 30
    n_jobs: 3
    # params:
      # tau: tag(log, interval(0.001, 1))
      # batch_size: choice(64, 128, 256)
      # gamma: tag(log, interval(0.9, 0.999))
      # exploration_fraction: range(0.1, 0.5, step=0.1)
      # exploration_initial_eps: range(0.5, 1.0, step=0.05)
      # exploration_final_eps: range(0.05, 0.1, step=0.01)
      # lr: tag(log, interval(1e-5, 1e-3))
seed: 42
gpu_id: 5
batch_size: 100
gamma: 0.99
learning_starts: 0
gradient_steps: 1
exploration_fraction: 0.4
exploration_initial_eps: 1.0
exploration_final_eps: 0
buffer_size: 500000
fraction_best: 0.25
tau: 0.055
lr: 1e-4

# if true, simulate a failure by raising an exception
error: false